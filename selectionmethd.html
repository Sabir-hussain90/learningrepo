<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selection Example</title>
</head>
<body>
    <p id="p">Select Me:<i>italic</i>and <b>bold</b></p>

    from <input id="from" disabled>
    -to <input id="to" disabled>

    <script>
        document.onselectionchange = function () {
            let selection = document.getSelection();

            let {
                anchorNode,
                anchorOffset,
                focusNode,
                focusOffset
            } = selection;

            from.value = `${anchorNode.nodeName}:${anchorOffset}`;
            to.value = `${focusNode.nodeName}:${focusOffset}`;
        };
    </script>
</body>
</html>
