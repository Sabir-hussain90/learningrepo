<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>doubleclick</title>

    <style>
        #box {
            width: 300px;
            height: 300px;
            background-color: black;
            margin: 200px 0 0 125px;
        }
    </style>
</head>
<body>
    <div id="box" ondblclick="fun()"></div>

    <script>
        function fun(){
            alert("you double-clicked the box");
        }
    </script>
</body>
</html>
