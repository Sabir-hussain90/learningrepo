<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onclick</title>
</head>

<body>

    <p>
        Today we are going to discuss the role of onclick when we select the text.
    </p>

    <input type="text" placeholder="enter the text" onclick="onlick()">

    <script>
        function onlick() {
            alert("You clicked the text box");
        }
    </script>

</body>
</html>
