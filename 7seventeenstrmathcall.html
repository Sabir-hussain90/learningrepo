<script>
 "use strict"
 let str = '<h1>Hello, world!</h1>';
let regexp = /<(.*?)>/g;
let matchAll = str.matchAll(regexp);
alert(matchAll);
matchAll = Array.from(matchAll);
let firstMatch = matchAll[0];
alert( firstMatch[0] ); 
alert( firstMatch[1] );  
alert( firstMatch.index );  
alert( firstMatch.input );

    </script>
