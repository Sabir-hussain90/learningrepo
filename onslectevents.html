<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onselect</title>
</head>
<body>

    <input type="text" placeholder="enter the text" onselect="showMessage()">

    <script>
        function showMessage() {
            alert("The text is selected");
        }
    </script>

</body>
</html>
