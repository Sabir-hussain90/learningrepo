<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Change</title>
</head>
<body>

<script>
"use strict";

document.body.style.background = 'red'; // make background red

setTimeout(() => {
    document.body.style.background = ''; // return back
}, 3000);

</script>

</body>
</html>
