<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input id="input" style="width: 200px;" value="text,text,text,text,text,text">
    <button id="button">insert "sabir hussain" at cursor</button>
    <script>
        button.onclick=()=>{
            input.setRangeText("sabir hussain",input.selectionStart,input.selectionEnd,"end");
            input.focus();
        };
    </script>
    
</body>
</html>
