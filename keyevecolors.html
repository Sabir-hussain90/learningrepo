<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Events</title>

    <style>
        body {
            background-color: wheat;
            background-image: url(background.jpg);
            background-size: 500%;
            background-position: -1600px -400px;
        }

        #form {
            width: 250px;
            margin: 100px auto 0 auto;
            border: 2px solid #000;
            border-radius: 15px;
            padding: 25px;
            background-color: rgba(0, 0, 0, 0.5);
            color: #fff;
            box-shadow: -2px 2px 15px #000;
        }

        input {
            width: 90%;
            margin-bottom: 10px;
            padding: 5px;
        }
        p,input{
            font-size: 20px;
        }
        input{
            width: 225px;
            border: 1px solid #000;
            border-radius: 10px;
            padding: 8px;
            background-color: #fff;
            box-shadow: inset -2px 2px 10px #000;
        }
    </style>
</head>

<body>

<div id="form">
    <h1>Keyboard Events</h1>

    <p>onkeydown</p>
    <input type="text" onkeydown="document.getElementById('form').style.background=(this.value)">

    <p>onkeyup</p>
    <input type="text" onkeyup="document.getElementById('form').style.background=(this.value)">

    <p>onkeypress</p>
    <input type="text" onkeypress="document.getElementById('form').style.background=(this.value)">

    <p id="output"></p>
</div>

<script>
    function showEvent(eventType) {
        document.getElementById("output").innerText =
            "Last event: " + eventType;
    }
</script>

</body>
</html>
